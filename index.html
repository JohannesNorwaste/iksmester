<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKS Mester</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#050a07;
  color:#cfe7d6;
  font-family:'DM Mono', monospace;
  overflow:hidden;
}

/* subtle green depth glow */
body::before{
  content:'';
  position:absolute;
  inset:-40%;
  background:
    radial-gradient(circle at 30% 30%, rgba(26,58,42,0.35), transparent 45%),
    radial-gradient(circle at 70% 60%, rgba(0,119,182,0.08), transparent 50%);
  filter:blur(40px);
}

.wrap{
  text-align:center;
  z-index:2;
}

/* logo block */
.logo{
  width:86px;
  height:86px;
  margin:0 auto 26px;
  background:#0e1a12;
  border:1px solid rgba(45,90,61,0.6);
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#2d7a4f;
  font-size:28px;
  box-shadow:0 0 30px rgba(26,58,42,0.25);
}

h1{
  margin:0;
  font-size:46px;
  letter-spacing:0.18em;
  color:#dff5e6;
}

.sub{
  margin-top:10px;
  font-size:11px;
  letter-spacing:0.35em;
  color:#6b8c76;
}

.line{
  margin-top:26px;
  font-size:12px;
  color:#9fb7a6;
  opacity:0.9;
}

.glow{
  margin-top:6px;
  font-size:12px;
  color:#2d7a4f;
  letter-spacing:0.25em;
  opacity:0.8;
}

button{
  margin-top:40px;
  padding:12px 30px;
  border-radius:999px;
  background:transparent;
  border:1px solid rgba(45,90,61,0.6);
  color:#dff5e6;
  cursor:pointer;
  letter-spacing:0.25em;
  transition:0.2s;
}

button:hover{
  border-color:#2d7a4f;
  box-shadow:0 0 20px rgba(45,122,79,0.25);
  transform:translateY(-2px);
}

.small{
  margin-top:18px;
  font-size:10px;
  color:#4e6a57;
}

</style>
</head>

<body>

<div class="wrap">

  <div class="logo">♻</div>

  <h1>IKS Mester</h1>

  <div class="sub">HVEM KJENNER AVFALLSNORGE BEST?</div>

  <div class="line">
    Spillet du har ventet på
  </div>

  <div class="glow">
    NORGE / AVFALL IKS
  </div>

  <button onclick="location.href='https://iksmester.no'">
    ENTER
  </button>

  <div class="small">v0.1 — LIVE</div>

</div>

</body>
</html>
